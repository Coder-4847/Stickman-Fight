<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Scarves — a stickman film</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eee;user-select:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#ecebe6;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:14px 18px;
      background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .35s}
  body:hover #ui,#ui.show{opacity:1}
  .btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;
       min-width:38px;height:32px;font-size:15px;cursor:pointer;padding:0 10px}
  .btn:hover{background:rgba(255,255,255,.22)}
  #bar{flex:1;height:6px;background:rgba(255,255,255,.22);border-radius:3px;cursor:pointer;position:relative}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#d8322a;border-radius:3px}
  #marks span{position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,255,255,.45)}
  #time{font-variant-numeric:tabular-nums;font-size:13px;opacity:.85;min-width:84px;text-align:right}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
           background:rgba(236,235,230,.94);color:#111;z-index:5;transition:opacity .5s}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay h1{font-weight:800;letter-spacing:.32em;margin:0 0 6px;font-size:clamp(28px,5vw,56px)}
  #overlay p{margin:0 0 28px;letter-spacing:.2em;font-size:13px;opacity:.6}
  #overlay .scarves{display:flex;gap:10px;margin-bottom:22px}
  #overlay .scarves i{display:block;width:46px;height:6px;border-radius:3px}
  #play{width:86px;height:86px;border-radius:50%;border:4px solid #111;background:#fff;cursor:pointer;position:relative}
  #play:after{content:"";position:absolute;left:33px;top:23px;border-left:28px solid #111;border-top:17px solid transparent;border-bottom:17px solid transparent}
  #play:hover{transform:scale(1.06)}
  #hint{margin-top:22px;font-size:12px;opacity:.5;letter-spacing:.08em}
  #replay{position:fixed;left:50%;top:68%;transform:translate(-50%,-50%);z-index:4;display:none;
          background:#111;color:#fff;border:0;border-radius:24px;padding:12px 28px;font-size:16px;letter-spacing:.15em;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <button class="btn" id="pp" title="Play/Pause (Space)">❚❚</button>
  <div id="bar"><div id="fill"></div><div id="marks"></div></div>
  <span id="time">0:00 / 2:00</span>
  <button class="btn" id="mute" title="Mute (M)">🔊</button>
</div>
<div id="overlay">
  <div class="scarves"><i style="background:#d8322a"></i><i style="background:#2f62d8"></i></div>
  <h1>TWO SCARVES</h1>
  <p>A STICKMAN FILM</p>
  <button id="play" aria-label="Play"></button>
  <div id="hint">sound on · space pause · m mute · keys 1–8 jump to scenes</div>
</div>
<button id="replay">↻ REPLAY</button>
<script>
'use strict';
/* =====================================================================
   0. CORE UTILITIES
   ===================================================================== */
const W = 1280, H = 720;
const TAU = Math.PI * 2, D2R = Math.PI / 180, R2D = 180 / Math.PI;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sgn = v => v < 0 ? -1 : 1;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const Ease = {
  lin: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  back: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
// deterministic hash noise for procedural backgrounds
function hash(n) { n = (n << 13) ^ n; return 1 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824; }
const h01 = n => (hash(n | 0) + 1) / 2;
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }

// palette — restrained greys, colour only for impact
const C = {
  paper: '#ecebe6', ink: '#141414', far: '#3c3c3c',
  g1: '#d9d8d2', g2: '#c6c5bf', g3: '#aeada7', g4: '#8f8e89', g5: '#6d6c68',
  red: '#d8322a', blue: '#2f62d8', fire: '#ff7a1a', fire2: '#ffc23a', flash: '#ffe46b',
  leaf: '#8e9a88', leafD: '#6f7b6a', glass: 'rgba(205,222,230,.55)'
};

/* =====================================================================
   1. AUDIO — procedural WebAudio sound design
   ===================================================================== */
let FF = false; // fast-forward (seeking): no sound, no slow-mo
const SFX = {
  ctx: null, out: null, bus: null, muted: false, nb: null, loops: {},
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.connect(c.destination);
    this.out = c.createGain(); this.out.gain.value = this.muted ? 0 : .85; this.out.connect(comp);
    this.bus = c.createGain(); this.bus.connect(this.out);
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.nb = b;
  },
  ok() { return this.ctx && !FF && this.ctx.state === 'running'; },
  setMute(m) { this.muted = m; if (this.out) this.out.gain.setTargetAtTime(m ? 0 : .85, this.ctx.currentTime, .05); },
  duck(level, t = .05) { if (this.bus) this.bus.gain.setTargetAtTime(level, this.ctx.currentTime, t); },
  dest(x) {
    const c = this.ctx;
    if (x == null || !c.createStereoPanner) return this.bus;
    const p = c.createStereoPanner(); p.pan.value = clamp((x - cam.x) * cam.zoom / (W * .7), -.85, .85); p.connect(this.bus); return p;
  },
  noise({ dur = .2, f = 1000, f2 = 0, q = 1, type = 'lowpass', g = .5, a = .002, x = null, delay = 0 }) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.nb; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
    const gn = c.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(g, t + a); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(gn); gn.connect(this.dest(x)); s.start(t, Math.random() * 1.5); s.stop(t + dur + .05);
  },
  tone({ f = 440, f2 = 0, dur = .2, type = 'sine', g = .3, a = .004, x = null, delay = 0 }) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = c.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(g, t + a); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn); gn.connect(this.dest(x)); o.start(t); o.stop(t + dur + .05);
  },
  // ---- sound library ----
  step(x) { this.noise({ dur: .06, f: 700, g: .07, x }); },
  land(x) { this.noise({ dur: .18, f: 500, g: .25, x }); this.tone({ f: 90, f2: 50, dur: .12, g: .2, x }); },
  whoosh(x, g = .14) { this.noise({ dur: .2, f: 500, f2: 1800, q: 2, type: 'bandpass', g, a: .07, x }); },
  hit(x, heavy) {
    this.noise({ dur: heavy ? .22 : .12, f: 2200, f2: 300, g: heavy ? .8 : .55, x });
    this.tone({ f: heavy ? 140 : 180, f2: 45, dur: heavy ? .25 : .14, g: heavy ? .6 : .4, x });
  },
  block(x) { this.noise({ dur: .08, f: 3000, type: 'highpass', g: .2, x }); this.tone({ f: 260, f2: 120, dur: .09, g: .3, x }); },
  gun(x) {
    this.noise({ dur: .28, f: 3500, f2: 250, g: .9, a: .001, x });
    this.tone({ f: 160, f2: 40, dur: .16, g: .7, x });
    this.noise({ dur: .7, f: 900, f2: 200, g: .12, x, delay: .03 });
  },
  click(x) { this.tone({ f: 2400, dur: .03, type: 'square', g: .08, x }); this.tone({ f: 1500, dur: .03, type: 'square', g: .06, x, delay: .06 }); },
  ric(x) { this.tone({ f: rnd(2200, 3200), f2: rnd(900, 1300), dur: .28, g: .07, x }); },
  metal(x, g = .25) { [310, 742, 1187, 1730].forEach((f, i) => this.tone({ f: f * rnd(.97, 1.03), dur: .35 - i * .05, type: 'triangle', g: g / (i + 1), x })); this.noise({ dur: .07, f: 4000, type: 'highpass', g: g * .8, x }); },
  clang(x) { [1830, 2650, 3910, 5200].forEach((f, i) => this.tone({ f, dur: .7 - i * .1, type: 'sine', g: .14 / (i * .6 + 1), x })); this.noise({ dur: .05, f: 5000, type: 'highpass', g: .4, x }); },
  glass(x) {
    this.noise({ dur: .55, f: 3500, type: 'highpass', g: .45, x });
    for (let i = 0; i < 9; i++) this.tone({ f: rnd(2500, 7000), dur: rnd(.08, .3), g: .05, x, delay: rnd(0, .4) });
  },
  twang(x) { this.tone({ f: 180, f2: 140, dur: .2, type: 'triangle', g: .25, x }); this.noise({ dur: .3, f: 2600, f2: 500, q: 3, type: 'bandpass', g: .18, a: .02, x }); },
  thunk(x) { this.tone({ f: 260, f2: 90, dur: .1, g: .45, x }); this.noise({ dur: .08, f: 1200, g: .3, x }); this.tone({ f: 95, dur: .35, type: 'triangle', g: .05, x, delay: .02 }); },
  slash(x) { this.noise({ dur: .15, f: 1500, f2: 5000, q: 3, type: 'bandpass', g: .2, a: .03, x }); },
  rustle(x, d = .35) { this.noise({ dur: d, f: 3200, q: .7, type: 'bandpass', g: .14, a: .05, x }); this.noise({ dur: d * .7, f: 1800, q: .7, type: 'bandpass', g: .08, a: .05, x, delay: .08 }); },
  snap(x) { this.noise({ dur: .05, f: 3000, type: 'highpass', g: .5, x }); this.tone({ f: 500, f2: 120, dur: .08, type: 'square', g: .1, x }); },
  screech(x) { this.tone({ f: 2400, f2: 1300, dur: .9, type: 'sawtooth', g: .05, a: .05, x }); this.tone({ f: 2900, f2: 1600, dur: .8, type: 'square', g: .025, a: .05, x, delay: .03 }); this.noise({ dur: .8, f: 2500, q: 6, type: 'bandpass', g: .12, a: .05, x }); },
  tires(x, d = .8) { this.noise({ dur: d, f: 2300, q: 9, type: 'bandpass', g: .16, a: .05, x }); },
  crash(x) { this.metal(x, .4); this.noise({ dur: .9, f: 1800, f2: 200, g: .7, x }); this.glass(x); },
  boom(x) { this.tone({ f: 90, f2: 30, dur: .6, g: .8, x }); this.noise({ dur: .9, f: 1600, f2: 120, g: .8, a: .002, x }); },
  explosion(x, big = 1) {
    this.noise({ dur: 2.4 * big, f: 1400, f2: 60, g: 1, a: .01, x });
    this.tone({ f: 70, f2: 22, dur: 1.6 * big, g: .9, x });
    for (let i = 0; i < 8; i++) this.noise({ dur: .08, f: 3000, type: 'highpass', g: .15, x, delay: rnd(.1, 1) });
  },
  whistle() { // western whistle gag
    const n = [[1175, .0, .35], [1568, .35, .3], [1397, .7, .18], [1175, .9, .5]];
    n.forEach(([f, d, l]) => this.tone({ f, f2: f * .99, dur: l, g: .07, a: .04, delay: d }));
  },
  launch(x) { this.noise({ dur: 3.5, f: 300, f2: 1400, g: .55, a: .4, x }); this.tone({ f: 60, f2: 120, dur: 3, type: 'sawtooth', g: .08, a: .3, x }); },
  beep() { this.tone({ f: 880, dur: .12, type: 'square', g: .05 }); },
  // ---- looping beds ----
  loop(name, { f = 400, type = 'noise', g = .1, q = 1, ft = 'lowpass' } = {}) {
    if (!this.ctx || this.loops[name]) return; const c = this.ctx;
    let src;
    if (type === 'noise') { src = c.createBufferSource(); src.buffer = this.nb; src.loop = true; }
    else { src = c.createOscillator(); src.type = type; src.frequency.value = f; }
    const fl = c.createBiquadFilter(); fl.type = ft; fl.frequency.value = type === 'noise' ? f : f * 3; fl.Q.value = q;
    const gn = c.createGain(); gn.gain.value = .0001; gn.gain.setTargetAtTime(FF ? .0001 : g, c.currentTime, .3);
    src.connect(fl); fl.connect(gn); gn.connect(this.bus); src.start();
    this.loops[name] = { src, fl, gn, g };
  },
  loopSet(name, f, g) {
    const L = this.loops[name]; if (!L) return; const t = this.ctx.currentTime;
    if (f != null) { if (L.src.frequency) { L.src.frequency.setTargetAtTime(f, t, .08); L.fl.frequency.setTargetAtTime(f * 3, t, .08); } else L.fl.frequency.setTargetAtTime(f, t, .1); }
    if (g != null) L.gn.gain.setTargetAtTime(FF ? .0001 : g, t, .1);
  },
  stopLoops(fade = .2) {
    for (const k in this.loops) { const L = this.loops[k]; try { L.gn.gain.setTargetAtTime(.0001, this.ctx.currentTime, fade); L.src.stop(this.ctx.currentTime + fade * 6); } catch (e) { } }
    this.loops = {};
  }
};
/* =====================================================================
   2. WORLD, TIMELINE, TWEENS
   ===================================================================== */
const world = {
  chars: [], props: [], projs: [], decals: [], tweens: [], timers: [],
  ground: x => 0, wind: 0, t: 0, timeScale: 1, slow: null, flash: null, light: 0,
  reset() {
    this.chars = []; this.props = []; this.projs = []; this.decals = []; this.tweens = []; this.timers = [];
    this.ground = x => 0; this.wind = 0; this.t = 0; this.flash = null; this.light = 0; this.slow = null; this.timeScale = 1;
    FX.ps = [];
  },
  add(p) { this.props.push(p); return p; },
  remove(p) { const i = this.props.indexOf(p); if (i >= 0) this.props.splice(i, 1); },
  after(d, fn) { this.timers.push({ t: this.t + d, fn }); },
  // surfaces characters can stand on: base ground + platform props
  groundAt(x, fromY = -1e9, ignore) {
    let g = this.ground(x), plat = null;
    for (const p of this.props) {
      if (!p.platform || p === ignore || p.dead) continue;
      const s = p.surface(x); if (s == null) continue;
      if (s >= fromY - 6 && s < g) { g = s; plat = p; }
    }
    return { y: g, plat };
  }
};

function tween(obj, to, dur, ease = Ease.inOut, done) {
  const from = {}; for (const k in to) from[k] = obj[k];
  world.tweens.push({ obj, from, to, dur, t: 0, ease, done });
}
function updateTweens(dt) {
  for (let i = world.tweens.length - 1; i >= 0; i--) {
    const w = world.tweens[i]; w.t += dt; const u = clamp(w.t / w.dur, 0, 1), e = w.ease(u);
    for (const k in w.to) w.obj[k] = lerp(w.from[k], w.to[k], e);
    if (u >= 1) { world.tweens.splice(i, 1); w.done && w.done(); }
  }
}

class Timeline {
  constructor() { this.ev = []; this.dur = []; this.i = 0; }
  at(t, fn) { this.ev.push({ t, fn }); return this; }
  during(t0, t1, fn) { this.dur.push({ t0, t1, fn }); return this; }
  start() { this.ev.sort((a, b) => a.t - b.t); this.i = 0; }
  update(t, dt) {
    while (this.i < this.ev.length && this.ev[this.i].t <= t) this.ev[this.i++].fn();
    for (const d of this.dur) if (t >= d.t0 && t < d.t1) d.fn((t - d.t0) / (d.t1 - d.t0), dt, t - d.t0);
  }
}

// slow motion (real-time duration, eased back to 1)
function slowmo(scale, realDur, inT = .08) { if (FF) return; world.slow = { scale, dur: realDur, t: 0, inT }; }
function hitstop(d = .06) { slowmo(.06, d, .001); }
function flash(color = '#fff', dur = .25, a = 1) { world.flash = { color, dur, t: 0, a }; }

/* =====================================================================
   3. CAMERA — follow, framing, zoom, shake
   ===================================================================== */
const cam = {
  x: 0, y: -200, zoom: 1, rot: 0, smooth: 3, zsmooth: 2, targets: null, o: {}, ov: null, trauma: 0, sx: 0, sy: 0, sr: 0, t: 0, prev: null,
  follow(targets, o = {}) {
    this.targets = targets; this.ov = null;
    this.o = Object.assign({ pad: 260, minZ: .55, maxZ: 1.7, zoom: null, dy: -70, dx: 0, comp: true }, o);
    if (o.smooth) this.smooth = o.smooth; if (o.zs) this.zsmooth = o.zs;
  },
  to(x, y, zoom, smooth = 3, zs) { this.ov = { x, y, zoom }; this.smooth = smooth; if (zs) this.zsmooth = zs; },
  cut(x, y, zoom) { this.x = x; this.y = y; this.zoom = zoom; this.prev = null; },
  shake(a) { if (!FF) this.trauma = Math.min(1.1, this.trauma + a); },
  aim() {
    if (this.ov) return this.ov;
    if (!this.targets || !this.targets.length) return { x: this.x, y: this.y, zoom: this.zoom };
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const t of this.targets) {
      const tx = t.camX != null ? t.camX : t.x, ty = t.camY != null ? t.camY : t.y;
      x0 = Math.min(x0, tx); x1 = Math.max(x1, tx); y0 = Math.min(y0, ty); y1 = Math.max(y1, ty);
    }
    const o = this.o, w = x1 - x0, h = y1 - y0;
    const z = o.zoom || clamp(Math.min(W / (w + o.pad * 2), H / (h + o.pad * 1.2 + 120)), o.minZ, o.maxZ);
    return { x: (x0 + x1) / 2 + o.dx, y: (y0 + y1) / 2 + o.dy, zoom: z };
  },
  update(dt, rdt) {
    this.t += rdt;
    const a = this.aim();
    let tx = a.x, ty = a.y;
    // lag compensation for fast-moving subjects (highway)
    if (!this.ov && this.o.comp && this.prev && dt > 0) {
      const vx = (tx - this.prev.x) / dt, vy = (ty - this.prev.y) / dt;
      if (Math.abs(vx) < 4000) { tx += vx / this.smooth; ty += vy / this.smooth * .5; }
    }
    this.prev = { x: a.x, y: a.y };
    const k = 1 - Math.exp(-this.smooth * dt), kz = 1 - Math.exp(-this.zsmooth * dt);
    this.x += (tx - this.x) * k; this.y += (ty - this.y) * k;
    this.zoom = Math.exp(lerp(Math.log(this.zoom), Math.log(a.zoom), kz));
    this.trauma = Math.max(0, this.trauma - rdt * 1.4);
    const s = this.trauma * this.trauma;
    this.sx = noise1(this.t * 23) * 26 * s; this.sy = noise1(this.t * 23 + 99) * 26 * s; this.sr = noise1(this.t * 17 + 50) * .03 * s;
  },
  apply(ctx) {
    ctx.translate(W / 2, H / 2); ctx.rotate(this.rot + this.sr); ctx.scale(this.zoom, this.zoom);
    ctx.translate(-this.x - this.sx, -this.y - this.sy);
  },
  // parallax layer: factor f (0 = infinitely far, 1 = world)
  layer(ctx, f, fy = f) {
    const z = 1 + (this.zoom - 1) * f;
    ctx.translate(W / 2, H / 2); ctx.rotate(this.sr * f); ctx.scale(z, z);
    ctx.translate(-(this.x + this.sx) * f, -(this.y + this.sy) * fy);
  },
  // visible world range in a layer
  range(f) { const z = 1 + (this.zoom - 1) * f; return [(this.x * f) - W / 2 / z - 50, (this.x * f) + W / 2 / z + 50]; }
};

/* =====================================================================
   4. PARTICLES — dust, sparks, debris, smoke, leaves, fire, glass…
   ===================================================================== */
const FX = {
  ps: [],
  add(o) {
    if (this.ps.length > 1600) this.ps.shift();
    const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 1, life: 1, size: 4, grow: 0, rot: rnd(TAU), vr: 0, c: C.g3, bounce: 0, a: 1 }, o);
    p.max = p.life; this.ps.push(p); return p;
  },
  update(dt) {
    const ps = this.ps;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i]; p.life -= dt;
      if (p.life <= 0) { ps.splice(i, 1); continue; }
      const dr = Math.pow(p.drag, dt * 60);
      p.vx *= dr; p.vy *= dr; p.vy += p.g * dt;
      if (p.flutter) { p.vx += Math.sin(world.t * p.flutter + p.rot * 7) * 260 * dt + world.wind * .4 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.size += p.grow * dt;

/* =====================================================================
   5. PROJECTILES — bullets, arrows, shells (real hits on props/chars)
   ===================================================================== */
class Proj {
  constructor(o) {
    Object.assign(this, { kind: 'bullet', x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 2, owner: null, hitsChars: false, dead: false, ignore: [], len: 40 }, o);
    this.trail = [];
    if (this.kind === 'arrow') this.g = this.g || 180;
  }
  update(dt) {
    const steps = Math.max(1, Math.ceil(Math.hypot(this.vx, this.vy) * dt / 10));
    for (let s = 0; s < steps && !this.dead; s++) {
      const h = dt / steps; this.vy += this.g * h; this.x += this.vx * h; this.y += this.vy * h;
      if (this.y > world.ground(this.x)) { this.onGround(); return; }
      for (const p of world.props) {
        if (!p.solid || p.dead || this.ignore.includes(p) || !p.hit(this.x, this.y)) continue;
        p.onHit(this, this.x, this.y);
        if (this.kind === 'arrow') world.decals.push(new StuckArrow(this.x, this.y, Math.atan2(this.vy, this.vx), p));
        this.dead = true; return;
      }
      if (this.hitsChars) for (const c of world.chars) {
        if (c === this.owner || !c.hitTest(this.x, this.y)) continue;
        c.onProjectile(this); this.dead = true; return;
      }
    }
    this.trail.push([this.x, this.y]); if (this.trail.length > 6) this.trail.shift();
    this.life -= dt; if (this.life <= 0) this.dead = true;
  }
  onGround() {
    this.dead = true;
    if (this.kind === 'arrow') { world.decals.push(new StuckArrow(this.x, world.ground(this.x), Math.atan2(this.vy, this.vx), null)); SFX.thunk(this.x); }
    else if (this.kind === 'shell') { explosion(this.x, this.y, 1.2); }
    else { dust(this.x, world.ground(this.x), 3, .4); }
  }
  draw(ctx) {
    const a = Math.atan2(this.vy, this.vx);
    if (this.kind === 'bullet') {
      const t = this.trail[0] || [this.x - this.vx * .02, this.y - this.vy * .02];
      const g = ctx.createLinearGradient(t[0], t[1], this.x, this.y); g.addColorStop(0, 'rgba(255,220,90,0)'); g.addColorStop(1, 'rgba(255,200,60,.95)');
      ctx.strokeStyle = g; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(t[0], t[1]); ctx.lineTo(this.x, this.y); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(this.x, this.y, 1.8, 0, TAU); ctx.fill();
    } else if (this.kind === 'arrow') {
      drawArrow(ctx, this.x, this.y, a, 1);
      const t = this.trail[0]; if (t) { ctx.strokeStyle = 'rgba(20,20,20,.15)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(t[0], t[1]); ctx.lineTo(this.x, this.y); ctx.stroke(); }
    } else if (this.kind === 'shell') {
      for (let i = 0; i < this.trail.length; i++) { const t = this.trail[i]; ctx.globalAlpha = i / this.trail.length * .5; ctx.fillStyle = C.g3; ctx.beginPath(); ctx.arc(t[0], t[1], 6 + (this.trail.length - i) * 2, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(a); ctx.fillStyle = C.g4; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.quadraticCurveTo(8, -6, -10, -6); ctx.lineTo(-10, 6); ctx.quadraticCurveTo(8, 6, 14, 0); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }
}
function drawArrow(ctx, x, y, a, alpha = 1, len = 46, head = true) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha *= alpha;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, 0); ctx.stroke();
  if (head) { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-5, -3.5); ctx.lineTo(-5, 3.5); ctx.fill(); }
  ctx.fillStyle = C.g4; ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(-len - 7, -5); ctx.lineTo(-len + 5, 0); ctx.lineTo(-len - 7, 5); ctx.fill();

}
class StuckArrow {
  constructor(x, y, a, parent) { this.parent = parent; this.ox = parent ? x - parent.x : x; this.oy = parent ? y - parent.y : y; this.a = a; this.t = 0; this.depth = rnd(10, 16); }

    this.t += dt; const wob = Math.sin(this.t * 60) * Math.exp(-this.t * 5) * .12;

function buildCity(o = {}) {
  let x = -1300, i = 0;
  const shopX = 640;
  while (x < 2600) {
    const w = 240 + h01(i * 5 + 2) * 120, h = 300 + h01(i * 3 + 1) * 220;
    if (x < shopX && x + w > shopX) { world.add(new Building({ x, w: 280, h: 420, seed: i, shop: true, fill: '#dddcd5' })); x += 280; }
    else { world.add(new Building({ x, w, h, seed: i, fill: i % 2 ? C.g1 : '#e0dfd8' })); x += w; }
    x += 10 + h01(i + 40) * 30; i++;
  }
  // the shop building sits at shopX's block; place window inside it
  const b = world.props.find(p => p.shop);
  const shop = world.add(new ShopWindow({ x: b.x + 55, broken: !!o.shopBroken }));
  for (const lx of [-420, 300, 1060, 1700]) world.add(new Lamppost({ x: lx }));
  return { shop };
}

function groundJungle(ctx) {

function fgJungle(ctx) {

    for (const c of [red, blue]) { c.base = 'lie'; c.lieRot = 90; c.P.rot = 90; c.ash = 1; c.update(0); c.resetScarf(); }
    cam.cut(0, -70, 1.7); cam.follow([red, blue], { pad: 200, zoom: 1.7, smooth: 1, dy: -40 });
    flash('#fff', 2.4, 1);
    SFX.duck(.0001, .01);
    tl.during(0, 7.5, () => { if (Math.random() < .5) FX.add({ t: 'ash', x: cam.x + rnd(-700, 700), y: cam.y - 420, vx: rnd(-10, 25), vy: rnd(30, 60), flutter: 2, life: 9, size: rnd(1.5, 3.5), vr: rnd(-2, 2), c: pick(['#8d8a84', '#bdbab3', '#77746e']), bounce: -1 }); });
    tl.at(1.6, () => { SFX.duck(1, 1.5); SFX.loop('wind', { f: 260, g: .05 }); });
    tl.at(1.3, () => { mR.sink = .9; red.base = 'crawl'; red.walkTo(-62, 26, 'crawl'); red.base = 'crawl'; dust(red.x, 0, 8, 1, '#b4b1aa'); tween(mR, { sink: .45 }, 2); });
    tl.at(1.8, () => { blue.base = 'crawl'; blue.walkTo(62, 26, 'crawl'); blue.base = 'crawl'; dust(blue.x, 0, 8, 1, '#b4b1aa'); tween(mB, { sink: .45 }, 2); });
    tl.during(1.3, 4.2, () => { for (const c of [red, blue]) if (c.goal != null && Math.random() < .15) dust(c.x, 0, 1, .4, '#b4b1aa'); });
    tl.at(4.0, () => { red.base = 'kneel'; blue.base = 'kneel'; tween(red, { ash: .35 }, 1.5); tween(blue, { ash: .35 }, 1.5); });
    tl.at(4.3, () => { cam.follow([red, blue], { pad: 160, zoom: 2.1, smooth: .8, dy: -60 }); });
    tl.at(4.7, () => { red.play('nod'); }); tl.at(4.95, () => { blue.play('nod'); });
  }
});

/* =====================================================================
   10. FILM PLAYER — main loop, rendering, UI, debug keys
   ===================================================================== */
let t0 = 0; for (const s of SCENES) { s.start = t0; t0 += s.dur; } const TOTAL = t0;
const film = { i: 0, t: 0, playing: false, ended: false, tl: null, scene: null };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

function loadScene(i) {
  world.reset(); SFX.stopLoops(.15); SFX.duck(1, .05); world.whiteout = false; world.cliffX = null; world.roadEnd = null;
  film.i = i; film.t = 0; film.scene = SCENES[i]; film.tl = new Timeline(); cam.trauma = 0; cam.prev = null; cam.ov = null;
  film.scene.init(film.tl); film.tl.start();
}
function step(dt) {
  const S = film.scene;
  world.dt = dt; world.t += dt; film.t += dt; world.light *= Math.exp(-5 * dt); if (world.flash) world.flash.t += dt;
  film.tl.update(film.t, dt);
  for (let i = world.timers.length - 1; i >= 0; i--) if (world.timers[i].t <= world.t) { const f = world.timers[i].fn; world.timers.splice(i, 1); f(); }
  updateTweens(dt);
  S.update && S.update(dt);
  for (const p of world.props) p.update(dt);
  for (const c of world.chars) c.update(dt);
  for (const p of world.projs) p.update(dt);
  world.projs = world.projs.filter(p => !p.dead);
  FX.update(dt);
  cam.update(dt, FF ? dt : rdtNow);
}
let rdtNow = 1 / 60;
function seek(gt) {
  gt = clamp(gt, 0, TOTAL - .01);
  let i = 0; while (i < SCENES.length - 1 && gt >= SCENES[i + 1].start) i++;
  FF = true; loadScene(i);
  const lt = gt - SCENES[i].start; while (film.t < lt - 1e-6) step(Math.min(1 / 60, lt - film.t));
  world.slow = null; world.flash = world.flash && world.flash.t < world.flash.dur ? world.flash : null;
  FF = false; film.ended = false; document.getElementById('replay').style.display = 'none';
  for (const k in SFX.loops) SFX.loopSet(k, null, SFX.loops[k].g);
}
function advance(rdt) {
  rdtNow = rdt;
  let ts = 1; const s = world.slow;
  if (s) { s.t += rdt; const u = s.t / s.dur; if (u >= 1) world.slow = null; else { const ui = s.inT / s.dur; ts = u < ui ? lerp(1, s.scale, u / ui) : u > .7 ? lerp(s.scale, 1, Math.pow((u - .7) / .3, 2)) : s.scale; } }
  world.timeScale = ts;
  const dt = rdt * ts, n = Math.max(1, Math.ceil(dt * 60 - 1e-4));
  for (let k = 0; k < n; k++) step(dt / n);
  if (film.t >= film.scene.dur) {
    if (film.i < SCENES.length - 1) loadScene(film.i + 1);
    else { film.playing = false; film.ended = true; document.getElementById('replay').style.display = 'block'; ui.pp.textContent = '▶'; }
  }
}

// ---- rendering ----
function render() {
  const S = film.scene;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  S.bg && S.bg(ctx);
  ctx.save(); cam.apply(ctx);
  S.ground && S.ground(ctx);
  const list = world.props.filter(p => !p.dead).concat(world.chars.filter(c => !c.ownerDraw));
  list.sort((a, b) => a.z - b.z);
  let decalsDone = false;
  for (const e of list) {
    if (!decalsDone && e.z >= 9) { for (const d of world.decals) d.draw(ctx, world.dt || 0); decalsDone = true; }
    e.draw(ctx);
  }
  if (!decalsDone) for (const d of world.decals) d.draw(ctx, world.dt || 0);
  for (const p of world.projs) p.draw(ctx);
  FX.draw(ctx);
  ctx.restore();
  S.fg && S.fg(ctx);
  // light bloom from explosions / muzzle flashes
  if (world.light > .01) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,170,80,${world.light * .22})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
  if (world.whiteout) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
  if (world.flash) { const f = world.flash, u = f.t / f.dur; if (u < 1) { ctx.globalAlpha = f.a * (1 - Ease.in(u)); ctx.fillStyle = f.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  // letterbox
  ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, 46); ctx.fillRect(0, H - 46, W, 46);
  // titles + chapter label
  ctx.textAlign = 'center';
  for (const [a, b, txt, sub] of S.titles || []) {
    if (film.t < a || film.t > b) continue; const al = clamp(Math.min((film.t - a) / .8, (b - film.t) / .8), 0, 1);
    ctx.globalAlpha = al; ctx.fillStyle = C.ink; ctx.font = '800 64px system-ui,sans-serif';
    ctx.save(); ctx.translate(W / 2, H / 2 - 150); ctx.fillText(txt.split('').join(String.fromCharCode(8202)), 0, 0);
    if (sub) { ctx.font = '500 16px system-ui,sans-serif'; ctx.fillStyle = C.g5; ctx.fillText(sub.toUpperCase().split('').join(' '), 0, 36); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (S.label && film.t < 3.2) { ctx.globalAlpha = clamp(Math.min(film.t / .5, (3.2 - film.t) / .6), 0, 1) * .8; ctx.fillStyle = '#eee'; ctx.font = '600 13px system-ui'; ctx.textAlign = 'left'; ctx.fillText(S.label, 28, H - 18); ctx.globalAlpha = 1; }
  // scene fades
  const fi = S.fadeIn != null ? S.fadeIn : .45;
  let fade = 0; if (fi > 0 && film.t < fi) fade = 1 - film.t / fi;
  if (!S.noFadeOut && film.t > S.dur - .35) fade = Math.max(fade, (film.t - (S.dur - .35)) / .35);
  if (fade > 0) { ctx.globalAlpha = clamp(fade, 0, 1); ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (debug) { ctx.fillStyle = '#d00'; ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.fillText(`${S.name} t=${film.t.toFixed(2)} g=${(S.start + film.t).toFixed(1)} fps=${fps.toFixed(0)} p=${FX.ps.length} ts=${world.timeScale.toFixed(2)}`, 10, 62); }
}

// ---- UI ----
const ui = { pp: document.getElementById('pp'), bar: document.getElementById('bar'), fill: document.getElementById('fill'), time: document.getElementById('time'), mute: document.getElementById('mute') };
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
for (const s of SCENES.slice(1)) { const m = document.createElement('span'); m.style.left = (s.start / TOTAL * 100) + '%'; document.getElementById('marks').appendChild(m); }
function play() { SFX.init(); film.playing = true; film.ended = false; ui.pp.textContent = '❚❚'; document.getElementById('overlay').classList.add('hide'); }
function pause() { film.playing = false; ui.pp.textContent = '▶'; }
ui.pp.onclick = () => { if (film.ended) { seek(0); play(); } else film.playing ? pause() : play(); };
ui.mute.onclick = () => { SFX.setMute(!SFX.muted); ui.mute.textContent = SFX.muted ? '🔇' : '🔊'; };
ui.bar.onclick = e => { const r = ui.bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); };
document.getElementById('play').onclick = () => { seek(0); play(); };
document.getElementById('replay').onclick = () => { seek(0); play(); };
let debug = /debug/.test(location.search), fps = 60;
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '8') { const s = SCENES[+e.key - 1]; if (s) { seek(s.start); play(); } }
  else if (e.code === 'Space') { e.preventDefault(); ui.pp.onclick(); }
  else if (e.key === 'm' || e.key === 'M') ui.mute.onclick();
  else if (e.key === 'ArrowRight') seek(film.scene.start + film.t + 5);
  else if (e.key === 'ArrowLeft') seek(film.scene.start + film.t - 5);
  else if (e.key === 'd' || e.key === 'D') debug = !debug;
});
let hideT = 0; addEventListener('mousemove', () => { document.getElementById('ui').classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => document.getElementById('ui').classList.remove('show'), 2200); });

let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  fps = lerp(fps, 1 / Math.max(rdt, 1e-3), .05);
  try {
    if (film.playing) advance(rdt);
    render();
  } catch (err) { console.error(err); film.playing = false; }
  const g = film.scene.start + film.t;
  ui.fill.style.width = (g / TOTAL * 100) + '%'; ui.time.textContent = `${fmt(g)} / ${fmt(TOTAL)}`;
  requestAnimationFrame(frame);
}
// boot: show the opening frame under the overlay; ?autoplay / ?t=SECONDS for testing
const Q = new URLSearchParams(location.search);
seek(+Q.get('t') || 0);
if (Q.has('autoplay')) { play(); }
window.__film = { seek, film, world, SCENES, TOTAL, step: (n = 1) => { for (let i = 0; i < n; i++) advance(1 / 60); render(); } };
requestAnimationFrame(frame);
</script>
</body>
</html>
